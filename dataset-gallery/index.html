<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Digitised motif grids and source information for $title.">
  <title>$title · HiDef Textiles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header"><a href="https://hideftextiles.github.io/">HiDef Textiles</a></header>
  <main>
    <section aria-labelledby="title">
      <h1 id="title">$title</h1>
      <dl>$metadata</dl>
      <nav aria-label="Dataset links">
        <a href="$source">Original source</a>
        <a href="$repository">Dataset on GitHub</a>
      </nav>
    </section>
    <section aria-labelledby="motifs">
      <h2 id="motifs">Motifs <span>($count)</span></h2>
      <div class="grid">$cards</div>
    </section>
  </main>
</body>
</html>

# Sjonabok pattern gallery. Same HÍ look as the HiDef textíll site
# (styles/ and img/hi/ are copied from HiDefTextiles/hidefTextiles.github.io,
# refresh them with scripts/sync-theme.sh). Build with `make gallery`
# from the repository root; patterns/ is generated by scripts/build_gallery.py.
project:
  type: website
  output-dir: _site
  resources:
    - img/hi/hi_logo.svg
    - patterns/**
    - js/**

lang: en

website:
  title: "Sjónabók gallery"
  description: "Browse and inspect about 600 Icelandic embroidery patterns from Íslensk sjónabók, digitised as 0/1 charts by HiDef Textiles."
  site-url: https://hideftextiles.github.io/Sjonabok/
  repo-url: https://github.com/HiDefTextiles/Sjonabok
  repo-actions: [issue]
  favicon: img/hi/favicon.svg
  search: true
  navbar:
    logo: img/hi/hi_named_logo-en.svg
    logo-alt: "University of Iceland"
    background: primary
    left:
      - text: "Gallery"
        href: index.qmd
      - text: "Explore"
        href: explore.qmd
      - text: "About"
        href: about.qmd
    tools:
      - icon: github
        href: https://github.com/HiDefTextiles/Sjonabok
        aria-label: GitHub
  page-footer:
    left: |
      Patterns from *Íslensk sjónabók* (Heimilisiðnaðarfélag Íslands, Listaháskóli Íslands,
      Þjóðminjasafn Íslands, 2009), digitised by [HiDef Textiles](https://hideftextiles.github.io/).
      The patterns are centuries old and in the public domain.
    right:
      - text: "HiDef textíll"
        href: https://hideftextiles.github.io/
      - icon: github
        href: https://github.com/HiDefTextiles/Sjonabok
        aria-label: GitHub

format:
  html:
    theme:
      - cosmo
      - styles/hi-site.scss
      - styles/hidef.scss
      - styles/gallery.scss
    css:
      - styles/hi-watermark.css
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    toc: true
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true

# Sjonabok pattern gallery. Same HÍ look as the HiDef textíll site
# (styles/ and img/hi/ are copied from HiDefTextiles/hidefTextiles.github.io,
# refresh them with scripts/sync-theme.sh). Build with `make gallery`
# from the repository root; patterns/ is generated by scripts/build_gallery.py.
project:
  type: website
  output-dir: _site
  resources:
    - styles/jost/**
    - img/hi/hi_logo.svg
    - patterns/**
    - js/**
    - map/web/**
    - original/**
    - tools/**
    - consent/**

lang: en

# chart counts, written by scripts/counts.py (make counts) from the chart files
metadata-files:
  - _counts.yml

website:
  title: "Sjónabók gallery"
  description: "Browse and inspect the Icelandic embroidery patterns and alphabets of Íslensk sjónabók, digitised as charts by HiDef Textiles."
  site-url: https://hideftextiles.github.io/Sjonabok/
  repo-url: https://github.com/HiDefTextiles/Sjonabok
  repo-actions: [issue]
  favicon: img/hi/favicon.svg
  search: true
  navbar:
    logo: img/hi/hi_named_logo-en.svg
    logo-alt: "University of Iceland"
    background: primary
    left:
      - text: "Gallery"
        href: index.qmd
      - text: "Explore"
        href: explore.qmd
      - text: "Methods"
        href: methods.qmd
      - text: "Alphabets"
        href: alphabets.qmd
      - text: "How we read old books"
        href: reading.qmd
      - text: "About"
        href: about.qmd
    tools:
      - icon: github
        href: https://github.com/HiDefTextiles/Sjonabok
        aria-label: GitHub
  page-footer:
    left: |
      Patterns from *Íslensk sjónabók* (Heimilisiðnaðarfélag Íslands, Listaháskóli Íslands,
      Þjóðminjasafn Íslands, 2009), digitised by [HiDef Textiles](https://hideftextiles.github.io/).
      The patterns are centuries old and in the public domain.
    right:
      - text: "Cookie settings"
        href: "#analytics-settings"
      - text: "HiDef textíll"
        href: https://hideftextiles.github.io/
      - icon: github
        href: https://github.com/HiDefTextiles/Sjonabok
        aria-label: GitHub

format:
  html:
    theme:
      - cosmo
      - styles/hi-site.scss
      - styles/hidef.scss
      - styles/gallery.scss
    css:
      - styles/jost/jost.css
      - styles/hi-watermark.css
    include-in-header:
      # Cookie consent (Klaro!, as on hi.is) and the Google Tag Manager
      # container shared by the HiDef Textiles sites. Nothing is sent to
      # Google Analytics until the visitor accepts. See consent/consent.js.
      - text: |
          <meta name="ga-measurement-id" content="GTM-5XPW89B4" data-langs="en is"
            data-privacy-href="/Sjonabok/about.html#privacy">
      - file: consent.html
    toc: true
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true

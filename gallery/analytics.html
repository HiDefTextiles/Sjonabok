<!-- Inlined into every page by _quarto.yml (include-in-header). -->
<script>
// Google Analytics with opt-in consent, shared by the HiDef Textiles sites
// (main site, Sjonabok gallery, Sjonabok-stafrof). Keep the copies identical.
//
// The ID is read from <meta name="ga-measurement-id"> set once in _quarto.yml:
// a Google Tag Manager container (GTM-...) or a GA4 Measurement ID (G-...).
// While it is empty or a placeholder (G-XXXXXXXXXX, GTM-XXXXXXX) this script
// does nothing: no banner, no Google request. Optional data-* attributes on
// the same <meta>: data-privacy-href (link to the privacy text), data-text,
// data-accept, data-decline, data-privacy-label (banner wording, e.g. Icelandic).
//
// With an ID, nothing is sent to Google until the visitor presses "Accept".
// Only then is gtm.js (or gtag.js) loaded, with Consent Mode set to analytics
// granted and ads denied. All three sites live on hideftextiles.github.io, so
// one answer covers them all. The choice is kept in localStorage ("hidef-analytics") and can
// be changed from any link to #analytics-settings (the footer link).
// Pages shown inside an iframe (the gallery embedded in the main HiDef site)
// never show the banner and never track.
(function () {
  "use strict";

  var KEY = "hidef-analytics";
  var meta, id;

  function read() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function write(v) { try { localStorage.setItem(KEY, v); } catch (e) { /* private mode */ } }

  var loaded = false;
  function load() {
    if (loaded) return;
    loaded = true;
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    gtag("consent", "default", {
      analytics_storage: "granted",
      ad_storage: "denied",
      ad_user_data: "denied",
      ad_personalization: "denied"
    });
    var s = document.createElement("script");
    s.async = true;
    if (id.indexOf("GTM-") === 0) {
      window.dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
      s.src = "https://www.googletagmanager.com/gtm.js?id=" + encodeURIComponent(id);
    } else {
      gtag("js", new Date());
      gtag("config", id);
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(id);
    }
    document.head.appendChild(s);
  }

  // Remove GA cookies after a visitor withdraws consent.
  function clearCookies() {
    var host = location.hostname;
    document.cookie.split(";").forEach(function (c) {
      var name = c.split("=")[0].trim();
      if (name === "_ga" || name.indexOf("_ga_") === 0) {
        ["", "; domain=" + host, "; domain=." + host].forEach(function (d) {
          document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/" + d;
        });
      }
    });
  }

  var banner;
  function close() { if (banner) { banner.remove(); banner = null; } }
  function choose(v) {
    var before = read();
    write(v);
    close();
    if (v === "granted") load();
    else if (before === "granted") { clearCookies(); location.reload(); }
  }

  function show() {
    if (banner) return;
    banner = document.createElement("div");
    banner.className = "hidef-consent";
    banner.setAttribute("role", "dialog");
    banner.setAttribute("aria-live", "polite");
    banner.setAttribute("aria-label", "Analytics consent");
    function opt(name, fallback) { return meta.getAttribute("data-" + name) || fallback; }
    var privacy = opt("privacy-href", "");
    banner.innerHTML =
      "<p>" + opt("text", "May we count visits with Google Analytics? It sets cookies and tells " +
        "us which pages are used, nothing else. Nothing is sent until you accept.") +
      (privacy ? ' <a href="' + privacy + '">' + opt("privacy-label", "Privacy") + "</a>" : "") +
      "</p>" +
      '<div class="hidef-consent-buttons">' +
      '<button type="button" class="btn btn-outline-primary" data-choice="denied">' +
      opt("decline", "No thanks") + "</button>" +
      '<button type="button" class="btn btn-primary" data-choice="granted">' +
      opt("accept", "Accept") + "</button>" +
      "</div>";
    banner.addEventListener("click", function (ev) {
      var b = ev.target.closest("button[data-choice]");
      if (b) choose(b.getAttribute("data-choice"));
    });
    document.body.appendChild(banner);
  }

  // Runs after parsing, since Quarto may place the <meta> after this script.
  function init() {
    meta = document.querySelector('meta[name="ga-measurement-id"]');
    id = meta ? (meta.getAttribute("content") || "").trim() : "";
    if (!/^(G|GTM)-[A-Z0-9]+$/.test(id) || /^(G|GTM)-X+$/.test(id)) return;
    var embedded;
    try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
    if (embedded) return;

    var v = read();
    if (v === "granted") load();
    else if (v !== "denied") show();
    document.addEventListener("click", function (ev) {
      var a = ev.target.closest("a[href$='#analytics-settings']");
      if (a) { ev.preventDefault(); show(); }
    });
    document.documentElement.classList.add("has-analytics");
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
